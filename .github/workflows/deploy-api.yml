name: Deploy Azure API
run-name: Deploy Scorekeeper API · ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      enable_game_operations:
        description: Enable replay-safe offline game operations on the existing API after deployment
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: scorekeeper-api-production
  cancel-in-progress: false
jobs:
  build:
    name: Build and test API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main after merging your changes."
            exit 1
          fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build API
        run: dotnet build backend/Scorekeeper.Api/Scorekeeper.Api.csproj -c Release
      - name: Run scoring and account tests
        run: dotnet run --project backend/Scorekeeper.Tests/Scorekeeper.Tests.csproj -c Release
      - name: Publish deployment package
        run: dotnet publish backend/Scorekeeper.Api/Scorekeeper.Api.csproj -c Release --no-restore --output "${{ runner.temp }}/scorekeeper-api"
      - name: Validate deployment package
        shell: bash
        env:
          PACKAGE_PATH: ${{ runner.temp }}/scorekeeper-api
        run: |
          for filename in host.json worker.config.json Scorekeeper.Api.dll; do
            test -f "$PACKAGE_PATH/$filename" || { echo "::error::Missing deployment file: $filename"; exit 1; }
          done
          if [[ -f "$PACKAGE_PATH/local.settings.json" ]]; then
            echo "::error::Local settings must not be included in a deployment package."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: scorekeeper-api-${{ github.run_id }}
          path: ${{ runner.temp }}/scorekeeper-api
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  deploy:
    name: Deploy tested API to Azure
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME || 'scorekeeper-api' }}
    steps:
      - name: Check Azure configuration
        shell: bash
        run: |
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Add the $key repository variable in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
      - uses: actions/download-artifact@v4
        with:
          name: scorekeeper-api-${{ github.run_id }}
          path: ${{ runner.temp }}/scorekeeper-api
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify target Function App
        id: target
        shell: bash
        run: |
          host=$(az resource show --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FUNCTIONAPP_NAME" --resource-type Microsoft.Web/sites --api-version 2024-04-01 --query properties.defaultHostName --output tsv)
          if [[ ! "$host" =~ ^[A-Za-z0-9.-]+\.azurewebsites\.net$ ]]; then
            echo "::error::Could not resolve the target Function App hostname."
            exit 1
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
      - name: Deploy published package
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ runner.temp }}/scorekeeper-api
          remote-build: false
      - name: Enable replay-safe game operations when requested
        if: ${{ inputs.enable_game_operations }}
        shell: bash
        run: |
          az functionapp config appsettings set --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FUNCTIONAPP_NAME" --settings ScorekeeperGameOperationsEnabled=true --output none
          configured=$(az functionapp config appsettings list --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FUNCTIONAPP_NAME" --query "[?name=='ScorekeeperGameOperationsEnabled'].value | [0]" --output tsv)
          if [[ "$configured" != "true" ]]; then
            echo "::error::Replay-safe operation setting could not be verified. Do not activate clients yet."
            exit 1
          fi
          echo "Replay-safe operation setting verified. Authenticated schema/capability acceptance is still required."
      - name: Check deployed API authentication
        shell: bash
        env:
          API_HOST: ${{ steps.target.outputs.host }}
        run: |
          for attempt in {1..6}; do
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/api-smoke-body" --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "https://$API_HOST/api/account") || status=000
            if [[ "$status" == "401" ]]; then
              echo "API responded correctly: unauthenticated requests are rejected."
              exit 0
            fi
            if [[ "$attempt" != "6" ]]; then sleep 10; fi
          done
          echo "::error::Expected HTTP 401 from /api/account; received $status. Inspect the Function App logs."
          exit 1
      - name: Summarize deployment
        shell: bash
        env:
          API_HOST: ${{ steps.target.outputs.host }}
          ENABLE_GAME_OPERATIONS: ${{ inputs.enable_game_operations }}
        run: |
          echo "## Azure API deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "API: https://$API_HOST/api" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ENABLE_GAME_OPERATIONS" == "true" ]]; then
            echo "Replay-safe game operation setting was enabled and verified. Authenticated capability/schema checks remain required." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Replay-safe operation setting was left unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Release build and scoring/account tests passed. Deployment completed and the authentication smoke check returned HTTP 401 as expected. Database/authenticated scoring still needs an end-to-end check." >> "$GITHUB_STEP_SUMMARY"
