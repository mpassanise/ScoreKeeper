name: Validate Scorekeeper
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/Scorekeeper.Api/Scorekeeper.Api.csproj -c Release
      - run: dotnet run --project backend/Scorekeeper.Tests/Scorekeeper.Tests.csproj -c Release
  sql-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Scorekeeper-CI-Only!2026'
        ports:
          - 1433:1433
        options: --memory=3g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project backend/Scorekeeper.SqlTests/Scorekeeper.SqlTests.csproj -c Release
        env:
          SCOREKEEPER_SQL_TEST_CONNECTION: 'Server=localhost,1433;User ID=sa;Password=Scorekeeper-CI-Only!2026;Encrypt=True;TrustServerCertificate=True;Connect Timeout=2'
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-api-client.mjs
      - run: node scripts/test-game-operation-contract.mjs
      - run: node scripts/test-frequent-players.mjs
      - run: node scripts/test-frequent-player-sync.mjs
      - run: node scripts/test-game-list-cache.mjs
      - run: node scripts/test-standings.mjs
      - run: node scripts/test-local-games.mjs
      - run: node scripts/test-sync-safety.mjs
      - run: npm ci --prefix tests/offline --ignore-scripts --no-audit --no-fund
      - run: node scripts/test-confirmed-repository.mjs
      - run: node scripts/test-sqlite-repository.mjs
      - run: node scripts/test-account-access.mjs
      - run: node scripts/test-durable-repository.mjs
      - run: node scripts/test-game-outbox.mjs
      - run: node scripts/test-repository-pilot.mjs
      - run: node scripts/test-connection-status.mjs
      - run: node scripts/test-account-refresh.mjs
      - run: node scripts/test-msal-callback.mjs
      - run: node scripts/test-player-drag.mjs
      - run: node scripts/test-mobile-buttons.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: node scripts/test-swipe-game-row.mjs
      - run: npx expo export --platform ios --output-dir /tmp/scorekeeper-mobile
        working-directory: mobile
