name: Validate Scorekeeper
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/Scorekeeper.Api/Scorekeeper.Api.csproj -c Release
      - run: dotnet run --project backend/Scorekeeper.Tests/Scorekeeper.Tests.csproj -c Release
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-api-client.mjs
      - run: node scripts/test-local-games.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npx expo export --platform ios --output-dir /tmp/scorekeeper-mobile
        working-directory: mobile
