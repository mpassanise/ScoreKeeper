name: Validate Scorekeeper
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/Scorekeeper.Api/Scorekeeper.Api.csproj -c Release
      - run: dotnet run --project backend/Scorekeeper.Tests/Scorekeeper.Tests.csproj -c Release
  sql-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start disposable SQL Server
        shell: bash
        run: |
          test_sql_password="Aa9!$(openssl rand -hex 24)"
          echo "::add-mask::$test_sql_password"
          docker run -d --rm --name scorekeeper-ci-sql --memory=3g -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$test_sql_password" -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          printf 'SCOREKEEPER_SQL_TEST_CONNECTION=Server=localhost,1433;User ID=sa;Password=%s;Encrypt=True;TrustServerCertificate=True;Connect Timeout=2\n' "$test_sql_password" >> "$GITHUB_ENV"
      - run: dotnet run --project backend/Scorekeeper.SqlTests/Scorekeeper.SqlTests.csproj -c Release
      - name: Stop disposable SQL Server
        if: always()
        run: docker rm -f scorekeeper-ci-sql
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-api-client.mjs
      - run: node scripts/test-game-operation-contract.mjs
      - run: node scripts/test-frequent-players.mjs
      - run: node scripts/test-frequent-player-sync.mjs
      - run: node scripts/test-game-list-cache.mjs
      - run: node scripts/test-standings.mjs
      - run: node scripts/test-local-games.mjs
      - run: node scripts/test-sync-safety.mjs
      - run: npm ci --prefix tests/offline --ignore-scripts --no-audit --no-fund
      - run: node scripts/test-confirmed-repository.mjs
      - run: node scripts/test-sqlite-repository.mjs
      - run: node scripts/test-account-access.mjs
      - run: node scripts/test-durable-repository.mjs
      - run: node scripts/test-cold-write-grant.mjs
      - run: node scripts/test-game-outbox.mjs
      - run: node scripts/test-game-reconciliation.mjs
      - run: node scripts/test-game-delivery.mjs
      - run: node scripts/test-manual-delivery.mjs
      - run: node scripts/test-game-read-model.mjs
      - run: node scripts/test-game-recovery.mjs
      - run: node scripts/test-game-home.mjs
      - run: node scripts/test-collision-resolution.mjs
      - run: node scripts/test-scoring-writer.mjs
      - run: node scripts/test-adoption-source.mjs
      - run: node scripts/test-repository-pilot.mjs
      - run: node scripts/test-connection-status.mjs
      - run: node scripts/test-account-refresh.mjs
      - run: node scripts/test-msal-callback.mjs
      - run: node scripts/test-player-drag.mjs
      - run: node scripts/test-mobile-buttons.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: node scripts/test-swipe-game-row.mjs
      - run: npx expo export --platform ios --output-dir /tmp/scorekeeper-mobile
        working-directory: mobile
